<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Animal Disease Chatbot</title>
  <style>
    :root {
      --bg: #f8f5ef;
      --panel: #ffffff;
      --ink: #1e293b;
      --muted: #64748b;
      --primary: #0f766e;
      --primary-2: #115e59;
      --accent: #f59e0b;
      --border: #e2e8f0;
    }

    * { box-sizing: border-box; }

    body {
      margin: 0;
      font-family: "Avenir Next", "Segoe UI", sans-serif;
      color: var(--ink);
      background:
        radial-gradient(circle at 20% 10%, rgba(245, 158, 11, 0.15), transparent 35%),
        radial-gradient(circle at 80% 90%, rgba(15, 118, 110, 0.15), transparent 30%),
        var(--bg);
      min-height: 100vh;
      display: grid;
      place-items: center;
      padding: 20px;
    }

    .app {
      width: min(920px, 100%);
      background: var(--panel);
      border: 1px solid var(--border);
      border-radius: 18px;
      box-shadow: 0 22px 45px rgba(30, 41, 59, 0.12);
      overflow: hidden;
    }

    .header {
      padding: 18px 22px;
      background: linear-gradient(120deg, var(--primary), var(--primary-2));
      color: #fff;
    }

    .header h1 {
      margin: 0;
      font-size: 1.4rem;
      letter-spacing: 0.3px;
    }

    .header p {
      margin: 6px 0 0;
      font-size: 0.92rem;
      opacity: 0.9;
    }

    .controls {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 10px;
      padding: 16px 20px;
      border-bottom: 1px solid var(--border);
      background: #fcfcfb;
    }

    .controls label {
      display: block;
      font-size: 0.82rem;
      color: var(--muted);
      margin-bottom: 6px;
      font-weight: 600;
    }

    select, input, textarea, button {
      font: inherit;
    }

    select, input, textarea {
      width: 100%;
      border: 1px solid var(--border);
      border-radius: 10px;
      padding: 10px 12px;
      background: #fff;
      color: var(--ink);
    }

    .chat {
      height: 420px;
      overflow-y: auto;
      padding: 16px 20px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .bubble {
      max-width: 82%;
      padding: 11px 13px;
      border-radius: 12px;
      line-height: 1.38;
      white-space: pre-wrap;
    }

    .bubble.user {
      align-self: flex-end;
      background: #d1fae5;
      border: 1px solid #99f6e4;
    }

    .bubble.bot {
      align-self: flex-start;
      background: #fff7ed;
      border: 1px solid #fed7aa;
    }

    .composer {
      border-top: 1px solid var(--border);
      padding: 14px 20px 20px;
      display: grid;
      gap: 10px;
    }

    .row {
      display: flex;
      gap: 10px;
    }

    button {
      border: none;
      background: var(--primary);
      color: white;
      border-radius: 10px;
      padding: 10px 16px;
      cursor: pointer;
      font-weight: 600;
    }

    button:hover {
      background: var(--primary-2);
    }

    .status {
      font-size: 0.83rem;
      color: var(--muted);
      min-height: 18px;
    }

    @media (max-width: 760px) {
      .controls {
        grid-template-columns: 1fr;
      }

      .chat {
        height: 360px;
      }

      .bubble {
        max-width: 92%;
      }
    }
  </style>
</head>
<body>
  <main class="app">
    <section class="header">
      <h1>Animal Disease Chatbot</h1>
      <p>Category-aware assistant powered by Gemini for disease and cure guidance.</p>
    </section>

    <section class="controls">
      <div>
        <label for="category">Animal Section</label>
        <select id="category">
          <option value="mammals">Mammals</option>
          <option value="herbivorous">Herbivorous</option>
          <option value="carnivorous">Carnivorous</option>
          <option value="reptiles">Reptiles</option>
        </select>
      </div>
      <div>
        <label for="animal">Specific Animal (optional)</label>
        <input id="animal" placeholder="e.g., dog, cow, turtle" />
      </div>
    </section>

    <section id="chat" class="chat"></section>

    <section class="composer">
      <textarea id="question" rows="3" placeholder="Describe symptoms or ask about a disease and cure..."></textarea>
      <div class="row">
        <button id="send">Ask</button>
      </div>
      <div id="status" class="status"></div>
    </section>
  </main>

  <script>
    const chat = document.getElementById('chat');
    const sendBtn = document.getElementById('send');
    const categoryEl = document.getElementById('category');
    const animalEl = document.getElementById('animal');
    const questionEl = document.getElementById('question');
    const statusEl = document.getElementById('status');

    const history = [];

    function addBubble(role, text) {
      const div = document.createElement('div');
      div.className = `bubble ${role === 'user' ? 'user' : 'bot'}`;
      div.textContent = text;
      chat.appendChild(div);
      chat.scrollTop = chat.scrollHeight;
    }

    async function ask() {
      const question = questionEl.value.trim();
      if (!question) return;

      const payload = {
        category: categoryEl.value,
        animal_name: animalEl.value.trim() || null,
        question,
        history,
      };

      addBubble('user', question);
      history.push({ role: 'user', content: question });
      questionEl.value = '';
      statusEl.textContent = 'Thinking...';
      sendBtn.disabled = true;

      try {
        const res = await fetch('/api/chat', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify(payload),
        });

        const raw = await res.text();
        let data = null;
        try {
          data = raw ? JSON.parse(raw) : {};
        } catch (_) {
          data = { detail: raw || 'Unknown server response' };
        }

        if (!res.ok) {
          throw new Error(data.detail || 'Request failed');
        }

        const note = data.warnings?.length
          ? `\n\nWarning: ${data.warnings.join(' | ')}`
          : '';
        addBubble('bot', `${data.answer}${note}`);
        history.push({ role: 'assistant', content: data.answer });
      } catch (err) {
        addBubble('bot', `Error: ${err.message}`);
      } finally {
        statusEl.textContent = '';
        sendBtn.disabled = false;
      }
    }

    sendBtn.addEventListener('click', ask);
    questionEl.addEventListener('keydown', (e) => {
      if (e.key === 'Enter' && (e.ctrlKey || e.metaKey)) {
        ask();
      }
    });

    addBubble('bot', 'Select a section and ask about symptoms, diseases, and treatment options.');
  </script>
</body>
</html>
